services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.10
    container_name: nginx-proxy
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - conjin-proxy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 2s
      timeout: 2s
      retries: 30

networks:
  conjin-proxy:
    external: true
    name: conjin-proxy
