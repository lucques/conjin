name: Tests

on:
    workflow_dispatch:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 90

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install Dhall
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes dhall

            - name: Set up repository
              run: ./setup.sh

            - name: Run all tests
              run: ./tests/run all

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: tests/artifacts/
                  if-no-files-found: ignore
                  retention-days: 14
