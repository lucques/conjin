name: Tests

on:
    workflow_dispatch:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 90

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Install Dhall tools
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  brew install dhall dhall-json
                  echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
                  dhall --version
                  dhall-to-json --version

            - name: Install setup tools and rclone
              run: |
                  sudo apt-get update
                  sudo apt-get install -y php8.3-cli php8.3-curl rclone

            - name: Set up repository
              id: setup
              run: ./setup.sh

            - name: Prepare test environments
              run: bin/test prepare

            - name: Run all tests
              if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
              run: bin/test all

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: test-artifacts/
                  if-no-files-found: ignore
                  retention-days: 14
