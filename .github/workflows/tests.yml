name: Tests

on:
    workflow_dispatch:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 90

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Check dependency-license inventory
              run: ./licenses/generate-report --check

            - name: Install Dhall tools
              run: |
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  brew install dhall dhall-json
                  echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
                  dhall --version
                  dhall-to-json --version

            - name: Set up repository
              run: ./setup.sh

            - name: Run all tests
              run: ./tests/run all

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: tests/artifacts/
                  if-no-files-found: ignore
                  retention-days: 14
